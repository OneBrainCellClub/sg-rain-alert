name: Rain Alert

on:
  schedule:
    - cron: '2-59/5 * * * *'  # every 5 minutes at :02, :07, :12 ... (avoids GitHub's busiest minutes; runs can still be late)
    - cron: '0 1 1 * *'     # monthly keep-alive (1st of the month, 09:00 Singapore time)
  workflow_dispatch:        # lets you press "Run workflow" on GitHub
    inputs:
      test:
        description: 'Send a test message with the current weather'
        type: boolean
        default: false

permissions:
  contents: write           # only for the monthly keep-alive commit

concurrency:
  group: rain-alert
  cancel-in-progress: false

jobs:
  check:
    if: github.event.schedule != '0 1 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Remembers the last alert level between runs, so alerts are not repeated
      - name: Restore last alert level
        uses: actions/cache@v4
        with:
          path: state.json
          key: rain-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rain-state-

      - name: Check weather, answer /update, send alerts
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOME_AREA: ${{ secrets.HOME_AREA }}
          HOME_LAT: ${{ secrets.HOME_LAT }}
          HOME_LON: ${{ secrets.HOME_LON }}
          SEND_TEST: ${{ inputs.test }}
        run: |
          if ($env:SEND_TEST -eq 'true') { ./rain-alert.ps1 -Test } else { ./rain-alert.ps1 }

  # GitHub pauses scheduled workflows in repos with no commits for 60 days.
  # An empty commit once a month keeps the schedule alive.
  keepalive:
    if: github.event.schedule == '0 1 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          git config user.name "rain-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep scheduled rain alert active"
          git push
